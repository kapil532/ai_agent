[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-commander-openenv"
version = "1.0.0"
description = "AI-powered DevOps incident simulation environment for training agents to debug and resolve real-world production failures"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Kapil", email = "kapil@example.com"}
]
keywords = [
    "openenv",
    "reinforcement-learning",
    "devops",
    "incident-management",
    "simulation",
    "agent-training"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "fastapi>=0.95.0",
    "uvicorn[standard]>=0.21.0",
    "pydantic>=1.10.0",
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "openenv>=0.1.0",
]

[project.scripts]
server = "api.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "flake8>=4.0",
    "isort>=5.10",
]

[project.urls]
Homepage = "https://github.com/kapil532/ai_agent"
Repository = "https://github.com/kapil532/ai_agent"
Documentation = "https://huggingface.co/spaces/kapil532/tathastu"
Issues = "https://github.com/kapil532/ai_agent/issues"

[tool.setuptools]
packages = ["api", "app", "baseline", "server"]

[tool.black]
line-length = 100
target-version = ['py38']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
